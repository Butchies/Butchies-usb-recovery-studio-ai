<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1f5c" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>
  <g transform="rotate(-18 256 270)" filter="url(#sh)">
    <!-- Stecker -->
    <rect x="198" y="74" width="116" height="92" rx="12" fill="#e8eefc" stroke="#ffffff" stroke-width="6"/>
    <rect x="222" y="98" width="24" height="24" rx="4" fill="#1d4ed8"/>
    <rect x="266" y="98" width="24" height="24" rx="4" fill="#1d4ed8"/>
    <!-- Gehäuse -->
    <rect x="168" y="160" width="176" height="250" rx="40" fill="url(#stick)"/>
    <!-- Herzschlag / Diagnose -->
    <polyline points="190,292 226,292 244,254 266,334 286,272 300,292 322,292"
              fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="370" r="10" fill="#22c55e"/>
  </g>
  <!-- KI-Funke -->
  <g transform="translate(392 132)">
    <path d="M0 -50 C6 -16 16 -6 50 0 C16 6 6 16 0 50 C-6 16 -16 6 -50 0 C-16 -6 -6 -16 0 -50 Z" fill="#ffffff"/>
    <path d="M0 -50 C6 -16 16 -6 50 0 C16 6 6 16 0 50 C-6 16 -16 6 -50 0 C-16 -6 -6 -16 0 -50 Z" fill="#93c5fd" opacity="0.35" transform="scale(0.55)"/>
  </g>
  <circle cx="440" cy="196" r="9" fill="#ffffff" opacity="0.9"/>
</svg>
